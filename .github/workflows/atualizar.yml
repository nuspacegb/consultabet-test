name: Automação Base de Apostas (SPA/MF)

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o repositório
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pandas lxml html5lib requests

    - name: Executar o Scraper
      run: python scraper.py

    - name: Salvar alterações no dados.json e historico.json
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add dados.json historico.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Atualização e Changelog de Empresas Autorizadas" && git push)
