# =============================================================================
#  NU - CONSULTA BET  |  Avisos (Slack + e-mail)
# =============================================================================
#
#  TRES GATILHOS NO MESMO ARQUIVO
#  ------------------------------
#  1. SEGUNDA-FEIRA  Resumo semanal, mesmo sem novidade.
#                    Vai para o seu DM no Slack E vira uma issue no GitHub,
#                    que o GitHub te manda por e-mail automaticamente.
#                    Quando houve mudanca na semana, o resumo ja inclui o
#                    texto pronto para voce colar no canal aberto.
#
#  2. PUBLICACAO     Quando voce da merge no PR do robo e a base nova entra
#                    no ar, chega um aviso imediato -- sem esperar segunda.
#
#  3. AVISO MANUAL   Voce escreve o texto e ele posta.
#
#  POR QUE O E-MAIL PASSA POR UMA ISSUE
#  ------------------------------------
#  Mandar e-mail de dentro do GitHub Actions exigiria guardar usuario e senha
#  de um servidor SMTP nos segredos -- coisa que conta corporativa costuma
#  bloquear. Como o GitHub ja te notifica por e-mail sobre issues do seu
#  proprio repositorio, a issue faz esse trabalho de graca e ainda deixa um
#  historico navegavel. A issue da semana anterior e fechada automaticamente,
#  entao fica sempre no maximo uma aberta.
#
#  CONFIGURACAO (uma vez so)
#  -------------------------
#  Settings > Secrets and variables > Actions
#    Secrets:    SLACK_WEBHOOK_URL  = a URL do Workflow Builder
#    Variables:  MODO_SLACK         = simples
#    Variables:  URL_SITE           = o endereco do site (opcional)
#
#  E confira que voce esta "Watching" o repositorio (canto superior direito),
#  senao o GitHub nao te manda o e-mail da issue.
#
# =============================================================================

name: Avisar no Slack

on:
  # 1. Resumo toda segunda, 10:00 de Brasilia (13:00 UTC)
  #
  #    Uma hora DEPOIS do robo da base, de proposito. Se os dois rodassem no
  #    mesmo horario, o resumo poderia ser montado antes da verificacao
  #    terminar -- e voce receberia na segunda um retrato de sexta-feira.
  schedule:
    - cron: '0 13 * * 1'

  # 2. A base nova entrou no ar
  push:
    branches: [main]
    paths:
      - 'historico.json'

  # 3. Aviso escrito por voce
  workflow_dispatch:
    inputs:
      assunto:
        description: 'Título do aviso'
        required: true
        default: 'Novidade no Consulta Bet'
      mensagem:
        description: 'O que você quer contar'
        required: true
        default: ''

permissions:
  contents: read
  issues: write        # necessario para o resumo virar e-mail

jobs:
  avisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5

      - name: Configurar o Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ---------------------------------------------------------------
      # 1. SEGUNDA-FEIRA
      # ---------------------------------------------------------------
      - name: Resumo semanal no Slack
        if: github.event_name == 'schedule'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          URL_SITE: ${{ vars.URL_SITE }}
          MODO_SLACK: ${{ vars.MODO_SLACK }}
        run: python avisar_slack.py semanal

      - name: Preparar o resumo para o e-mail
        if: github.event_name == 'schedule'
        id: relatorio
        env:
          URL_SITE: ${{ vars.URL_SITE }}
        run: |
          python avisar_slack.py semanal --markdown > corpo.md
          python avisar_slack.py semanal --titulo-issue > titulo.txt
          echo "Titulo: $(cat titulo.txt)"

      - name: Enviar o resumo por e-mail (via issue)
        if: github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const corpo  = fs.readFileSync('corpo.md', 'utf8');
            const titulo = fs.readFileSync('titulo.txt', 'utf8').trim();
            const hoje   = new Date().toLocaleDateString('pt-BR');
            const url    = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Fecha o resumo da semana passada, para ficar sempre um so aberto
            const antigas = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'resumo-semanal',
            });
            for (const issue of antigas.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Consulta Bet · resumo de ${hoje}`,
              labels: ['resumo-semanal'],
              body: `${corpo}\n\n---\n\n<sub>Resumo automático de segunda-feira. `
                  + `[Ver a execução](${url}) · esta issue fecha sozinha na próxima semana.</sub>`,
            });

      # ---------------------------------------------------------------
      # 2. A BASE MUDOU E FOI PUBLICADA
      # ---------------------------------------------------------------
      - name: Anunciar mudancas na lista
        if: github.event_name == 'push'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          URL_SITE: ${{ vars.URL_SITE }}
          MODO_SLACK: ${{ vars.MODO_SLACK }}
        run: python avisar_slack.py mudancas

      # ---------------------------------------------------------------
      # 3. AVISO ESCRITO NA MAO
      # ---------------------------------------------------------------
      - name: Postar aviso manual
        if: github.event_name == 'workflow_dispatch'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          URL_SITE: ${{ vars.URL_SITE }}
          MODO_SLACK: ${{ vars.MODO_SLACK }}
          ASSUNTO: ${{ inputs.assunto }}
          MENSAGEM: ${{ inputs.mensagem }}
        run: python avisar_slack.py aviso --assunto "$ASSUNTO" --texto "$MENSAGEM"
